<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VB Manager Ver16</title><style>body{font-family:sans-serif;max-width:1200px;margin:auto;padding:12px}.hidden{display:none}.panel{border:1px solid #ccc;border-radius:12px;padding:10px;margin-bottom:12px}.court{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.zone{min-height:180px;border:2px dashed #999;border-radius:12px;padding:8px}.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-height:360px;overflow-y:auto}.card{min-height:110px;padding:10px;border-radius:12px;cursor:move;font-weight:bold;display:flex;flex-direction:column;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.2)}.front{background:#90caf9}.setter{background:#fff59d}.back{background:#a5d6a7}.warn{color:red;font-weight:bold}.ok{color:green;font-weight:bold}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:12px}.serverNow{background:#4caf50;color:#fff;padding:6px;border-radius:6px}.serverNext{background:#ffe082;padding:6px;border-radius:6px}.serveRow{display:flex;justify-content:space-between;align-items:center;margin:4px 0;padding:4px;border-bottom:1px solid #eee}button{padding:4px 8px}</style></head><body><h2>VB Manager Ver16</h2><button onclick="show('reg')">選手登録</button> <button onclick="show('game')">試合画面</button><div id='reg'><p><input id='name'><select id='gender'><option>男性</option><option>女性</option></select><select id='pos'><option>前衛</option><option>セッター</option><option>後衛</option></select><button onclick='addPlayer()'>登録</button></p><table border='1' style='width:100%'><tbody id='plist'></tbody></table></div><div id='game' class='hidden'><div class="panel">
  <b>自チーム</b><br>
  <button onclick="scoreChange('my',-1)">－</button>
  <span id="myScore">0</span>
  <button onclick="scoreChange('my',1)">＋</button>

  <br><br>

  <b>相手チーム</b><br>
  <button onclick="scoreChange('opp',-1)">－</button>
  <span id="oppScore">0</span>
  <button onclick="scoreChange('opp',1)">＋</button>

  <br><br>

  <button onclick="resetScore()">得点リセット</button>

  <button onclick="resetPts()">出場Ptリセット</button>
</div>
<div id='female'></div><div class='panel'><h3>コート</h3><div class='court'><div class='zone' data-loc='LF'>④ LF</div>
<div class='zone' data-loc='CF'>③ CF(S)</div>
<div class='zone' data-loc='RF'>② RF</div>

<div class='zone' data-loc='LB'>⑤ LB</div>
<div class='zone' data-loc='CB'>⑥ CB</div>
<div class='zone' data-loc='RB'>① RB</div></div></div><div class='panel'><h3>ベンチ</h3><div id='bench' class='pool'></div></div><div class='bottom'><div class='panel'><h3>出場Pt少ない順</h3><div id='rank'></div></div><div class='panel'><h3>サーブ順</h3><button onclick='rotateServer()'>サーブ終了</button><div id='serveList'></div></div></div></div><script>const KEY='vb16';let dragServeIndex=null;let state=JSON.parse(localStorage.getItem(KEY)||'{"players":[],"myScore":0,"oppScore":0,"serveOrder":[]}');

if(state.score!==undefined){
  state.myScore=state.score;
  state.oppScore=0;
  delete state.score;
}if(!state.serveOrder)state.serveOrder=[];function save(){localStorage.setItem(KEY,JSON.stringify(state));renderAll()}function addPlayer(){const n=document.getElementById('name').value.trim();if(!n)return;const id=Date.now()+Math.random();state.players.push({id,name:n,gender:gender.value,pos:pos.value,pts:0,location:'bench'});state.serveOrder.push(id);name.value='';save()}function delPlayer(id){state.players=state.players.filter(p=>p.id!==id);state.serveOrder=state.serveOrder.filter(x=>x!==id);save()}function cls(p){return p.pos==='前衛'?'front':p.pos==='セッター'?'setter':'back'}function cardHtml(p){return `<div class="card ${cls(p)}" draggable="true" data-id="${p.id}">${p.gender==='女性'?'🔴 ':''}${p.name}<br>${p.pos}<br>${p.pts}pt</div>`}function renderReg(){plist.innerHTML=state.players.map(p=>`<tr><td>${p.name}</td><td>${p.gender}</td><td>${p.pos}</td><td>${p.pts}</td><td><button onclick='delPlayer(${p.id})'>削除</button></td></tr>`).join('')}function renderGame(){bench.innerHTML='';const labels={
  LF:'④ LF',
  CF:'③ CF(S)',
  RF:'② RF',
  LB:'⑤ LB',
  CB:'⑥ CB',
  RB:'① RB'
};

document.querySelectorAll('.zone').forEach(
  z=>z.innerHTML=labels[z.dataset.loc]
);state.players.forEach(p=>{if(p.location==='bench')bench.insertAdjacentHTML('beforeend',cardHtml(p));else{let z=document.querySelector(`[data-loc="${p.location}"]`);if(z)z.insertAdjacentHTML('beforeend',cardHtml(p));}});bind();rank.innerHTML=[...state.players].sort((a,b)=>a.pts-b.pts).map(p=>`${p.name} (${p.pts}pt)`).join('<br>');let f=state.players.filter(p=>p.location!=='bench'&&p.gender==='女性').length;female.className=f>=2?'ok':'warn';female.textContent=f>=2?`女性 ${f}名 ✅`:`女性 ${f}名 ⚠`;myScore.textContent=state.myScore;
oppScore.textContent=state.oppScore;renderServe();}

function renderServe(){

serveList.innerHTML='';

state.serveOrder.forEach((id,i)=>{

  ...

  let c='';

  if(i===0)c='serverNow';
  else if(i===1)c='serverNext';

  serveList.innerHTML+=`

<div class="serveRow ${c}" draggable="true"
data-index="${i}"><span>
${i===0?'▶ ':i===1?'▷ ':''}
${p.name}
${p.location!=='bench' ? ' ✅' : ''}
</span><span><button onclick='moveUp(${i})'>↑</button><button onclick='moveDown(${i})'>↓</button></span></div>`;});
bindServeDrag();
}
function moveUp(i){if(i<=0)return;[state.serveOrder[i-1],state.serveOrder[i]]=[state.serveOrder[i],state.serveOrder[i-1]];save()}function moveDown(i){
if(i>=state.serveOrder.length-1)return;[state.serveOrder[i+1],state.serveOrder[i]]=[state.serveOrder[i],state.serveOrder[i+1]];save()}
function moveServe(from,to){

  if(from===to)return;

  const item=
    state.serveOrder.splice(
      from,
      1
    )[0];

  state.serveOrder.splice(
    to,
    0,
    item
  );

  save();

}
function bindServeDrag(){

  document
    .querySelectorAll('.serveRow')
    .forEach(row=>{

      row.ondragstart=e=>{

        dragServeIndex=
          Number(
            row.dataset.index
          );

      };

      row.ondragover=e=>{

        e.preventDefault();

      };

      row.ondrop=e=>{

        e.preventDefault();

        moveServe(
          dragServeIndex,
          Number(
            row.dataset.index
          )
        );

      };

    });

}
function rotateServer(){
if(state.serveOrder.length<2)return;state.serveOrder.push(state.serveOrder.shift());save()}function bind(){document.querySelectorAll('.card').forEach(c=>c.ondragstart=e=>e.dataTransfer.setData('id',c.dataset.id));document.querySelectorAll('.zone,#bench').forEach(t=>{t.ondragover=e=>e.preventDefault();t.ondrop=e=>{e.preventDefault();const p=state.players.find(x=>x.id==e.dataTransfer.getData('id'));if(!p)return;if(t.id==='bench'){

  p.location='bench';

}else{

  const old=
  state.players.find(
    x=>x.location===t.dataset.loc
  );

  if(old && old.id!==p.id){
    old.location='bench';
  }

  p.location=t.dataset.loc;
}

save();save();};});}function scoreChange(team,v){

  const active=
  state.players.filter(
    p=>p.location!=='bench'
  );

  if(v>0){

    active.forEach(
      p=>p.pts++
    );

    if(team==='my'){
      state.myScore++;
    }else{
      state.oppScore++;
    }

  }else{

    if(team==='my' && state.myScore>0){
      state.myScore--;
    }

    if(team==='opp' && state.oppScore>0){
      state.oppScore--;
    }

  }

  save();
}function resetScore(){

  state.myScore=0;
  state.oppScore=0;

  save();
}

function resetPts(){

  state.players.forEach(
    p=>p.pts=0
  );

  save();
}function show(id){reg.classList.add('hidden');game.classList.add('hidden');document.getElementById(id).classList.remove('hidden')}function renderAll(){renderReg();renderGame()}renderAll();</script></body></html>
