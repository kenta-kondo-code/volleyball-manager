<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VB Manager Ver15</title><style>body{font-family:sans-serif;padding:12px;max-width:1200px;margin:auto}.hidden{display:none}.panel{border:1px solid #ccc;border-radius:12px;padding:10px;margin-bottom:12px}.court{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.zone{min-height:180px;border:2px dashed #999;border-radius:12px;padding:8px}.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-height:360px;overflow-y:auto}.card{min-height:110px;padding:10px;border-radius:12px;cursor:move;font-weight:bold;display:flex;flex-direction:column;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.2)}.front{background:#90caf9}.setter{background:#fff59d}.back{background:#a5d6a7}.warn{color:red;font-weight:bold}.ok{color:green;font-weight:bold}button{padding:6px 10px}</style></head><body><h2>VB Manager Ver15</h2><button onclick="show('reg')">選手登録</button> <button onclick="show('game')">試合画面</button><div id='reg'><p><input id='name'><select id='gender'><option>男性</option><option>女性</option></select><select id='pos'><option>前衛</option><option>セッター</option><option>後衛</option></select><button onclick='addPlayer()'>登録</button></p><table border='1' style='width:100%'><tbody id='plist'></tbody></table></div><div id='game' class='hidden'><div>得点 <button onclick='scoreChange(-1)'>-</button> <span id='score'>0</span> <button onclick='scoreChange(1)'>+</button></div><div id='female'></div><div class='panel'><h3>コート</h3><div class='court'><div class='zone' data-loc='LF'>LF</div><div class='zone' data-loc='CF'>CF(S)</div><div class='zone' data-loc='RF'>RF</div><div class='zone' data-loc='LB'>LB</div><div class='zone' data-loc='CB'>CB</div><div class='zone' data-loc='RB'>RB</div></div></div><div class='panel'><h3>ベンチ</h3><div id='bench' class='pool'></div></div><div class='panel'><h3>出場Pt少ない順</h3><div id='rank'></div></div></div><script>const KEY='vb15';let state=JSON.parse(localStorage.getItem(KEY)||'{"players":[],"score":0}');function save(){localStorage.setItem(KEY,JSON.stringify(state));renderAll()}function addPlayer(){const n=document.getElementById('name').value.trim();if(!n)return;state.players.push({id:Date.now()+Math.random(),name:n,gender:gender.value,pos:pos.value,pts:0,location:'bench'});name.value='';save()}function delPlayer(id){state.players=state.players.filter(p=>p.id!==id);save()}function cls(p){return p.pos==='前衛'?'front':p.pos==='セッター'?'setter':'back'}function cardHtml(p){return `<div class="card ${cls(p)}" draggable="true" data-id="${p.id}">${p.gender==='女性'?'🔴 ':''}${p.name}<br>${p.pos}<br>${p.pts}pt</div>`}function renderReg(){plist.innerHTML=state.players.map(p=>`<tr><td>${p.name}</td><td>${p.gender}</td><td>${p.pos}</td><td>${p.pts}</td><td><button onclick='delPlayer(${p.id})'>削除</button></td></tr>`).join('')}function renderGame(){bench.innerHTML='';document.querySelectorAll('.zone').forEach(z=>z.innerHTML=z.dataset.loc+(z.dataset.loc==='CF'?'(S)':''));state.players.forEach(p=>{if(p.location==='bench')bench.insertAdjacentHTML('beforeend',cardHtml(p));else document.querySelector(`[data-loc="${p.location}"]`).insertAdjacentHTML('beforeend',cardHtml(p));});bind();rank.innerHTML=[...state.players].sort((a,b)=>a.pts-b.pts).map(p=>`${p.name} (${p.pts}pt)`).join('<br>');let f=state.players.filter(p=>p.location!=='bench'&&p.gender==='女性').length;female.className=f>=2?'ok':'warn';female.textContent=f>=2?`女性 ${f}名 ✅`:`女性 ${f}名 ⚠`;score.textContent=state.score;}function bind(){document.querySelectorAll('.card').forEach(c=>c.ondragstart=e=>e.dataTransfer.setData('id',c.dataset.id));document.querySelectorAll('.zone,#bench').forEach(t=>{t.ondragover=e=>e.preventDefault();t.ondrop=e=>{e.preventDefault();const p=state.players.find(x=>x.id==e.dataTransfer.getData('id'));if(!p)return;if(t.id!=='bench'&&t.querySelector('.card'))return;p.location=t.id==='bench'?'bench':t.dataset.loc;save();};});}function scoreChange(v){const active=state.players.filter(p=>p.location!=='bench');if(v>0){active.forEach(p=>p.pts++);state.score++;}else if(v<0&&state.score>0){active.forEach(p=>p.pts=Math.max(0,p.pts-1));state.score--;}save()}function show(id){reg.classList.add('hidden');game.classList.add('hidden');document.getElementById(id).classList.remove('hidden')}function renderAll(){renderReg();renderGame()}renderAll();</script></body></html>
